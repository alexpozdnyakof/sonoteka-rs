[package]
name = "sonoteka-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
hex = "0.4.3"
image = "0.25.10"
lofty = "0.25.5"
md-5 = "0.11.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "process", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
walkdir = "2.5.0"
async-stream = "0.3.6"
